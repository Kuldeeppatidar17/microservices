spring:
  application:
    name: cards
  datasource:
    url: jdbc:h2:mem:carddb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

cards:
  message: "Welcome to Cards Microservice!"
  contact-info:
    name: "Support Team"
    email: "support@kd.com"
  on-call-support:
    - 9999999999
    - 8888888888
