spring:
  application:
    name: account
  datasource:
    url: jdbc:mysql://localhost:3306/accountdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  profiles:
    active:
      - "qa"
  config:
    import: "configserver:http://localhost:8071/"
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
endpoints:
  shutdown:
    enabled: true
  info:
    env:
      enabled: true
server:
  port: 8081

jwt:
  secret-key: 6W6k8TzA7wB9LmN2QrS4UvX8YpE3HdF5JkR7NsT9VxC2ZmP8
  access-token-expiration: 3600000

logging:
  level:
    org.springframework.beans.factory: INFO

build:
  version: "1.0"
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "account"
    description: "KD account application !"
    version: "1.0.0"
