spring:
  application:
    name: account
  spring:
    datasource:
      url: jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      driver-class-name: org.h2.Driver
      username: sa
      password:
    h2:
      console:
        enabled: true
        path: /h2-console
    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: update
      show-sql: true
    sql:
      init:
        mode: always
  profiles:
    active:
      - "qa"
  config:
    import: "configserver:http://localhost:8071/"
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
  info:
    env:
      enabled: true
server:
  port: 8081

jwt:
  secret-key: 6W6k8TzA7wB9LmN2QrS4UvX8YpE3HdF5JkR7NsT9VxC2ZmP8
  access-token-expiration: 3600000

logging:
  level:
    org.springframework.beans.factory: INFO

build:
  version: "1.0"
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "account"
    description: "KD account application !"
    version: "1.0.0"
