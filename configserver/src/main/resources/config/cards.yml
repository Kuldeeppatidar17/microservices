spring:
  application:
    name: cards
  datasource:
    url: jdbc:mysql://localhost:3306/accountdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

cards:
  message: "Welcome to Cards Microservice!"
  contact-info:
    name: "Support Team"
    email: "support@kd.com"
  on-call-support:
    - 9999999999
    - 8888888888
